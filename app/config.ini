# The server configuration is not in a section [...]
host=localhost
port=8001
json=data.json


# Every section is an unique "virtual server". Could be any name. I.e.:
#[Book Shop]

# Path or paths comma separated to JSON access
# "localhost:6666/sales" and "localhost:6666/ventas" will be the same.
# Longer paths can be used: lang/en/sales,lang/es/sales, ...
#
#paths=sales,ventas

# Available method for operations
#methods=GET,POST,PUT,PATCH,HEAD,DELETE

# You can define aliases for JSON fields to adapt them to your application.
# For example, if the JSON contains a field named "code" but your application
# expects "id", you can create an alias so that requests using "id" are mapped
# to the "code" field in the JSON.
# Multiple aliases can be defined using "|" as a separator.
#
#field aliases=id,code|hash,signature|noun,name


# If true, methods that change data like POST, PUT, PATCH and DELETE are not
# allowed. The server will return 405 Method Not Allowed.
# This is useful if you want to test your application's permissions.
# Default value is false.
#
#readonly=true


# If true, methods that change data like POST, PUT, PATCH and DELETE are
# processed normally but changes are not persisted.
# The server behaves as if the operation succeeded, without modifying the data.
# This is useful for testing client applications without altering the dataset.
# Default value is false.
#
#dry run=true


# Sample:
#[Book Shop]
#paths=sales,ventas
#methods=GET,POST,PUT,PATCH,HEAD,DELETE
#readonly=false
#field aliases=id,code|phone,telephone|name,noun
